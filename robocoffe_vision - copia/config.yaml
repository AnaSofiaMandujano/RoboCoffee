# =====================================================================
#  RoboCoffe - Sistema de medición de repetibilidad por visión
#  Archivo único de configuración. Todas las unidades en mm y grados.
#  <POR MEDIR>  = dato que se obtiene con cinta métrica / prueba física
#  <RELLENAR>   = decisión del equipo
# =====================================================================

camara:
  indice: 0                 # índice de cv2.VideoCapture (0 = primera cámara USB)
  ancho: 1940
  alto: 1080
  fps: 30
  altura_lente_mm: 1920     # altura aproximada del lente sobre el piso (solo referencia;
                            # la pose real se calcula con los marcadores del piso)
  bloquear_autoajustes: true  # intenta desactivar autofoco / autoexposición
  foco_manual: 0            # valor de foco fijo si la cámara lo soporta; <POR MEDIR> el que da imagen nítida a ~1.7–1.9 m
  archivo_calibracion: datos/camara.yaml

aruco:
  diccionario: DICT_4X4_50  # 4x4 = celdas grandes, robusto a distancia

# ---------------------------------------------------------------------
# Tablero ChArUco para calibrar el lente (script 2)
# ---------------------------------------------------------------------
charuco:
  cuadros_x: 7
  cuadros_y: 5
  lado_cuadro_mm: 32.0      # 7x32 = 224 mm y 5x32 = 160 mm (cabe perfecto en carta horizontal)
  lado_marcador_mm: 24.0
  hoja: carta       
# ---------------------------------------------------------------------
# Área de prueba: 2 x 3 losetas de 600 mm = 1200 x 1800 mm
# Origen (0,0) en la esquina de la loseta junto al ArUco ID 30.
# IDs 0-26 los usa el tablero ChArUco; por eso piso = 30-35 y robot = 40.
# Eje X a lo largo del lado largo (1800), eje Y a lo largo del lado corto (1200).
# ---------------------------------------------------------------------
area:
  largo_x_mm: 1800
  ancho_y_mm: 1200

# Marcadores fijos en el piso (centro del marcador, z = 0).
# Posiciones NOMINALES: centro de cada marcador a 100 mm hacia adentro de las
# líneas de la loseta (así no quedan cortados en el borde de la imagen).
# Después de pegarlos, MEDIR con cinta desde las líneas y reemplazar el valor.
marcadores_piso:
  lado_mm: 150.0
  posiciones:               # id: [x_mm, y_mm]   (nominal -> <POR MEDIR>)
    30: [100, 100]
    31: [900, 100]
    32: [1700, 100]
    33: [100, 1100]
    34: [900, 1100]
    35: [1700, 1100]

# ---------------------------------------------------------------------
# Robot
# ---------------------------------------------------------------------
robot:
  id_marcador: 40
  lado_marcador_mm: 60.0    # debe caber en el cupholder; <POR MEDIR> diámetro útil del cupholder
  lado_marcador_con_vaso_mm: 45.0
  diametro_mm: 100
  # Altura del PLANO del marcador sobre el piso, por condición de prueba
  altura_marcador_mm:
    sin_vaso: 270           # dato del equipo (altura sin vaso)
    con_vaso: 360          # <POR MEDIR> altura de la tapa del vaso + disco con marcador
  # Desfase del centro del marcador respecto al eje de giro del robot (se obtiene
  # en el script 5 haciendo girar el robot sobre su eje). Inicial = 0.
  offset_marcador_mm: [0.0, 0.0]
  offset_theta_deg: 0.0     # ángulo entre el eje X del marcador y el "frente" del robot

# ---------------------------------------------------------------------
# Prueba A -> B -> A (ciclos continuos, sin reposicionar a mano)
# ---------------------------------------------------------------------
prueba:
  punto_A: [210, 600, 0.0]      # [x_mm, y_mm, theta_deg] nominal -> <POR MEDIR> al marcar con cinta
  punto_B: [1210, 600, 0.0]     # theta de llegada a B: <RELLENAR> (0° si llega de frente; 180° si gira antes de detenerse)
  tolerancia_mm: 150
  ciclos: 30
  # Detección de "robot detenido"
  quieto_umbral_mm: 2.0
  quieto_tiempo_s: 1.0
  frames_promedio: 30
